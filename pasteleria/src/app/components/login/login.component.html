<div class="login-page">

  <h2>Iniciar sesión</h2>

  <input type="text"
         placeholder="Usuario"
         [(ngModel)]="username"
         class="login-input">

  <input type="password"
         placeholder="Contraseña"
         [(ngModel)]="password"
         class="login-input">

  <button class="login-button" (click)="login()">Ingresar</button>

  <button class="login-btn" routerLink="/registro">Crear cuenta</button>

  <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>

</div>>
