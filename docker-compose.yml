version: '3.9'

services:

  flask_app:
    build: ./api
    container_name: reposteria_flask
    env_file:
      - ./api/.env
    depends_on:
      - postgres_db
    networks:
      - reposteria_net
    expose:
      - "5000"

  nginx:
    image: nginx:latest
    container_name: reposteria_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./pasteleria/dist:/usr/share/nginx/html
    depends_on:
      - flask_app
    networks:
      - reposteria_net

  postgres_db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: reposteria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reposteria_net

networks:
  reposteria_net:

volumes:
  postgres_data:
