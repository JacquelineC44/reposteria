version: '3.9'

services:

  flask_app:
    build: ./api
    container_name: reposteria_flask
    ports:
      - "5000:5000"
    restart: always

  django_app:
    build: ./django_app
    container_name: reposteria_django
    ports:
      - "8000:8000"
    depends_on:
      - postgres_db
    environment:
      - DJANGO_DB_HOST=postgres_db
      - DJANGO_DB_NAME=reposteria_db
      - DJANGO_DB_USER=postgres
      - DJANGO_DB_PASSWORD=postgres

  nginx:
    image: nginx:latest
    container_name: reposteria_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - flask_app
      - django_app

  postgres_db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: reposteria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
