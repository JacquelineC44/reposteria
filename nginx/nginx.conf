server {
    listen 80;

    # Flask
    location /api/ {
        proxy_pass http://flask_app:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django
    location /django/ {
        proxy_pass http://django_app:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular (frontend)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
